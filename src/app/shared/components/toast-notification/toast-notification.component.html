<div 
  class="relative overflow-hidden rounded-2xl border shadow-2xl backdrop-blur-xl bg-white/95 dark:bg-slate-900/95 max-w-md w-full p-4 pointer-events-auto transition-all animate-fade-in isolate"
  [class.border-amber-500/40]="data.type === 'warning'"
  [class.shadow-amber-500/10]="data.type === 'warning'"
  [class.border-rose-500/40]="data.type === 'danger'"
  [class.shadow-rose-500/10]="data.type === 'danger'"
  [class.border-emerald-500/40]="data.type === 'success'"
  [class.shadow-emerald-500/10]="data.type === 'success'"
  [class.border-blue-500/40]="data.type === 'info'"
  [class.shadow-blue-500/10]="data.type === 'info'"
>
  <div class="flex items-start gap-3">
    <!-- Icon Avatar -->
    <div 
      class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 border"
      [class.bg-amber-500/10]="data.type === 'warning'"
      [class.border-amber-500/20]="data.type === 'warning'"
      [class.text-amber-600]="data.type === 'warning'"
      [class.dark:text-amber-400]="data.type === 'warning'"

      [class.bg-rose-500/10]="data.type === 'danger'"
      [class.border-rose-500/20]="data.type === 'danger'"
      [class.text-rose-600]="data.type === 'danger'"
      [class.dark:text-rose-400]="data.type === 'danger'"

      [class.bg-emerald-500/10]="data.type === 'success'"
      [class.border-emerald-500/20]="data.type === 'success'"
      [class.text-emerald-600]="data.type === 'success'"
      [class.dark:text-emerald-400]="data.type === 'success'"

      [class.bg-blue-500/10]="data.type === 'info'"
      [class.border-blue-500/20]="data.type === 'info'"
      [class.text-blue-600]="data.type === 'info'"
      [class.dark:text-blue-400]="data.type === 'info'"
    >
      <span class="material-icons-round text-2xl">{{ defaultIcon }}</span>
    </div>

    <!-- Content -->
    <div class="flex-1 min-w-0 pr-1">
      <div class="flex items-center justify-between gap-2">
        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-900 dark:text-white truncate">
          {{ defaultTitle }}
        </h4>
        <span class="text-[10px] text-slate-400 dark:text-slate-500 font-medium">teraz</span>
      </div>
      <p class="text-xs text-slate-600 dark:text-slate-300 mt-1 leading-relaxed">
        {{ data.message }}
      </p>

      @if (data.actionText) {
        <div class="mt-2.5 flex items-center gap-2">
          <button
            type="button"
            (click)="onAction()"
            class="text-xs font-semibold px-2.5 py-1 rounded-lg transition-colors"
            [class.bg-amber-500/10]="data.type === 'warning'"
            [class.hover:bg-amber-500/20]="data.type === 'warning'"
            [class.text-amber-700]="data.type === 'warning'"
            [class.dark:text-amber-300]="data.type === 'warning'"

            [class.bg-rose-500/10]="data.type === 'danger'"
            [class.hover:bg-rose-500/20]="data.type === 'danger'"
            [class.text-rose-700]="data.type === 'danger'"
            [class.dark:text-rose-300]="data.type === 'danger'"

            [class.bg-emerald-500/10]="data.type === 'success'"
            [class.hover:bg-emerald-500/20]="data.type === 'success'"
            [class.text-emerald-700]="data.type === 'success'"
            [class.dark:text-emerald-300]="data.type === 'success'"

            [class.bg-blue-500/10]="data.type === 'info'"
            [class.hover:bg-blue-500/20]="data.type === 'info'"
            [class.text-blue-700]="data.type === 'info'"
            [class.dark:text-blue-300]="data.type === 'info'"
          >
            {{ data.actionText }}
          </button>
        </div>
      }
    </div>

    <!-- Close button -->
    <button
      type="button"
      (click)="onClose()"
      class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors shrink-0 -mr-1 -mt-1"
      title="Zamknij powiadomienie"
    >
      <span class="material-icons-round text-base">close</span>
    </button>
  </div>

  <!-- Countdown Progress Bar (5 sekund) -->
  <div class="absolute bottom-0 left-0 right-0 h-1 bg-slate-100/60 dark:bg-slate-800/80 rounded-b-2xl overflow-hidden">
    <div 
      class="h-full transition-all duration-75 ease-linear"
      [style.width.%]="progressWidth()"
      [class.bg-amber-500]="data.type === 'warning'"
      [class.bg-rose-500]="data.type === 'danger'"
      [class.bg-emerald-500]="data.type === 'success'"
      [class.bg-blue-500]="data.type === 'info'"
    ></div>
  </div>
</div>
