<router-outlet></router-outlet>

<!-- Global Toast Stack Container (Pełna responsywność: na mobile równe marginesy boczne, na desktopie prawy róg) -->
<div class="fixed top-20 sm:top-24 left-3 right-3 sm:left-auto sm:right-6 z-50 flex flex-col gap-3 pointer-events-none sm:max-w-md sm:w-full">
  @for (toast of toastService.toasts(); track toast.id) {
    <app-toast-notification
      class="pointer-events-auto w-full"
      [toast]="toast"
      (dismiss)="toastService.dismiss($event)"
    />
  }
</div>
