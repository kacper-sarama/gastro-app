<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
  <div class="relative w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col my-8">
    
    <!-- Modal Header (nie drukowany) -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-slate-800 print:hidden">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-blue-500/10 text-blue-500 flex items-center justify-center">
          <span class="material-icons-round text-xl">qr_code_2</span>
        </div>
        <div>
          <h2 class="text-base font-bold text-slate-900 dark:text-white">Kod QR na stoliki</h2>
          <p class="text-xs text-slate-500 dark:text-slate-400">Dostęp do menu na żywo dla gości lokalu</p>
        </div>
      </div>
      <button
        (click)="close.emit()"
        class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
      >
        <span class="material-icons-round text-xl">close</span>
      </button>
    </div>

    <!-- Printable Card Content -->
    <div class="p-6 text-center space-y-5 print:p-8" id="printable-table-card">
      <div>
        <span class="inline-block px-3 py-1 rounded-full text-[11px] font-semibold tracking-wider uppercase bg-orange-100 dark:bg-orange-950/40 text-orange-600 dark:text-orange-400 mb-2">
          Karta Menu Online
        </span>
        <h3 class="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">
          {{ restaurantName }}
        </h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
          Zeskanuj aparatorem telefonu, aby przejrzeć nasze menu i aktualną dostępność dań.
        </p>
      </div>

      <!-- Ramka z kodem QR -->
      <div class="inline-flex flex-col items-center justify-center p-4 bg-white rounded-2xl border-2 border-slate-200 shadow-inner">
        <img
          [src]="qrCodeImageUrl"
          alt="Kod QR do karty dań"
          class="w-56 h-56 object-contain rounded-lg"
          loading="lazy"
        />
        <div class="flex items-center gap-1.5 mt-3 text-slate-500 text-[11px] font-medium">
          <span class="material-icons-round text-sm text-blue-500">smartphone</span>
          <span>Aparat lub czytnik kodów QR</span>
        </div>
      </div>

      <!-- Publiczny link do menu -->
      <div class="space-y-2 print:hidden">
        <p class="text-[11px] font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider">
          Bezpośredni adres www:
        </p>
        <div class="flex items-center gap-2 p-1.5 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
          <input
            type="text"
            [value]="menuUrl"
            readonly
            class="bg-transparent text-xs text-slate-700 dark:text-slate-300 px-2 flex-1 outline-none font-mono truncate"
          />
          <button
            type="button"
            (click)="copyLink()"
            class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors flex items-center gap-1.5"
            [ngClass]="copied() 
              ? 'bg-emerald-600 text-white' 
              : 'bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-600 border border-slate-200 dark:border-slate-600'"
          >
            <span class="material-icons-round text-sm">{{ copied() ? 'check' : 'content_copy' }}</span>
            <span>{{ copied() ? 'Skopiowano!' : 'Kopiuj' }}</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Footer (nie drukowany) -->
    <div class="flex items-center justify-between px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800 print:hidden">
      <button
        type="button"
        (click)="printTableCard()"
        class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600 border border-slate-200 dark:border-slate-600 transition-colors shadow-sm"
      >
        <span class="material-icons-round text-base text-slate-500 dark:text-slate-400">print</span>
        <span>Drukuj winietkę na stolik</span>
      </button>

      <button
        type="button"
        (click)="close.emit()"
        class="gastro-btn-primary py-2 px-4 text-xs"
      >
        Gotowe
      </button>
    </div>

  </div>
</div>
