<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
    <!-- Header -->
    <div class="px-6 py-5 border-b border-slate-800 flex items-center justify-between bg-slate-900/60">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center border border-emerald-500/20">
          <span class="material-icons-round text-xl">local_shipping</span>
        </div>
        <div>
          <h3 class="text-lg font-bold text-white leading-tight">Szybka Dostawa</h3>
          <p class="text-xs text-slate-400 mt-0.5 truncate max-w-[240px]">
            {{ item.name }}
          </p>
        </div>
      </div>
      <button (click)="close.emit()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800">
        <span class="material-icons-round text-2xl">close</span>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6 space-y-5">
      <!-- Current vs Future Stock Box -->
      <div class="p-4 rounded-xl bg-slate-950/60 border border-slate-800/80 flex items-center justify-between">
        <div>
          <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Aktualny Stan</p>
          <p class="text-lg font-bold text-slate-200 mt-0.5">{{ currentFormatted.display }}</p>
        </div>
        <div class="text-slate-600 text-xl font-bold">➔</div>
        <div class="text-right">
          <p class="text-[11px] font-semibold text-emerald-400 uppercase tracking-wider">Po Dostawie</p>
          <p class="text-lg font-bold text-emerald-400 mt-0.5">{{ newFormatted.display }}</p>
        </div>
      </div>

      <!-- Quick Presets -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Szybki wybór ilości dostawy:
        </label>
        <div class="grid grid-cols-3 gap-2">
          @for (preset of presets; track preset.label) {
            <button
              type="button"
              (click)="setPreset(preset.baseAmount)"
              class="py-2.5 px-3 rounded-lg border text-sm font-medium transition-all text-center"
              [class.border-emerald-500]="addedBaseAmount === preset.baseAmount"
              [class.bg-emerald-500/10]="addedBaseAmount === preset.baseAmount"
              [class.text-emerald-400]="addedBaseAmount === preset.baseAmount"
              [class.border-slate-800]="addedBaseAmount !== preset.baseAmount"
              [class.bg-slate-800/60]="addedBaseAmount !== preset.baseAmount"
              [class.text-slate-300]="addedBaseAmount !== preset.baseAmount"
            >
              {{ preset.label }}
            </button>
          }
        </div>
      </div>

      <!-- Custom Input -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
          Lub wpisz własną ilość dostawy:
        </label>
        <div class="flex gap-2">
          <input
            type="number"
            step="any"
            min="0"
            [(ngModel)]="customInputValue"
            (ngModelChange)="onCustomInputChange()"
            placeholder="0"
            class="gastro-input flex-1"
          />
          <select [(ngModel)]="customMultiplier" (ngModelChange)="onCustomInputChange()" class="gastro-input w-28 shrink-0">
            @if (item.unit === 'g') {
              <option [value]="1000">kg</option>
              <option [value]="1">g</option>
            } @else if (item.unit === 'ml') {
              <option [value]="1000">litry (l)</option>
              <option [value]="1">ml</option>
            } @else {
              <option [value]="1">szt</option>
            }
          </select>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-slate-800 bg-slate-900/60 flex items-center justify-end gap-3">
      <button (click)="close.emit()" type="button" class="gastro-btn-secondary">
        Anuluj
      </button>
      <button
        (click)="confirmDelivery()"
        [disabled]="addedBaseAmount <= 0"
        type="button"
        class="gastro-btn-primary bg-emerald-600 hover:bg-emerald-500 shadow-emerald-600/20 disabled:opacity-50"
      >
        <span class="material-icons-round text-lg">add_shopping_cart</span>
        <span>Zatwierdź dostawę</span>
      </button>
    </div>
  </div>
</div>
